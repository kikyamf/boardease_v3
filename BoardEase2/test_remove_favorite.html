<!DOCTYPE html>
<html>
<head>
    <title>Test Remove Favorite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #f44336;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #da190b;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Test Remove Favorite API</h1>
    
    <form id="testForm">
        <div class="form-group">
            <label for="user_id">User ID:</label>
            <input type="number" id="user_id" name="user_id" value="1" required>
        </div>
        
        <div class="form-group">
            <label for="bh_id">Boarding House ID (bh_id):</label>
            <input type="number" id="bh_id" name="bh_id" value="1" required>
        </div>
        
        <button type="submit">Remove from Favorites</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('user_id').value;
            const bhId = document.getElementById('bh_id').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.textContent = 'Sending request...';
            resultDiv.className = 'result';
            
            // Create form data
            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('bh_id', bhId);
            
            // Send POST request
            fetch('remove_favorite.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.className = 'result ' + (data.success ? 'success' : 'error');
            })
            .catch(error => {
                resultDiv.textContent = 'Error: ' + error.message;
                resultDiv.className = 'result error';
            });
        });
    </script>
</body>
</html>
